apply plugin: 'com.android.application'

/*
 * Signature de release.
 *
 * Rien de secret ne vit ici, et rien de secret ne doit y arriver. La configuration lit, dans cet
 * ordre, un fichier `android/keystore.properties` (poste de Julien) puis des variables
 * d'environnement (CI). Les deux sont exclus de Git par `apps/tools/.gitignore`, qui ignore déjà
 * `android/keystore.properties` ainsi que tout fichier d'extension .jks ou .keystore.
 *
 * Quand aucune des deux sources n'est fournie, `signingConfig` reste nul et Gradle produit un AAB
 * NON SIGNÉ. C'est volontaire : un AAB signé par une clé de debug n'est pas déposable, et le
 * laisser croire serait pire que de ne rien signer. Le build ne doit donc jamais échouer faute de
 * clé, mais il ne doit jamais non plus prétendre en avoir une.
 *
 * Rappel Play App Signing : la clé configurée ici est la clé de TÉLÉVERSEMENT. La clé de
 * signature d'application, celle dont l'empreinte SHA-256 va dans `assetlinks.json`, est détenue
 * par Google et se relève dans Play Console.
 */
def keystorePropertiesFile = rootProject.file('keystore.properties')
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

/** Valeur du fichier si présente, sinon de l'environnement, sinon nulle. */
def signingValue = { String key, String variable ->
    keystoreProperties.getProperty(key) ?: System.getenv(variable)
}

def releaseStoreFile = signingValue('storeFile', 'ELSATIA_TOOLS_KEYSTORE_FILE')
def releaseStorePassword = signingValue('storePassword', 'ELSATIA_TOOLS_KEYSTORE_PASSWORD')
def releaseKeyAlias = signingValue('keyAlias', 'ELSATIA_TOOLS_KEY_ALIAS')
def releaseKeyPassword = signingValue('keyPassword', 'ELSATIA_TOOLS_KEY_PASSWORD')
def hasReleaseSigning = releaseStoreFile && releaseStorePassword && releaseKeyAlias && releaseKeyPassword


android {
    namespace = "fr.elsatia.tools"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "fr.elsatia.tools"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }
    buildTypes {
        release {
            /* Nul si aucune clé n'est fournie : l'AAB sort alors non signé, et l'assume. */
            signingConfig hasReleaseSigning ? signingConfigs.release : null
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation "com.android.billingclient:billing:9.1.0"
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}

/*
 * Diagnostic explicite, à lancer avant un dépôt : `./gradlew :app:signingStatus`.
 * Il dit si la release sera signée, SANS jamais imprimer un chemin, un alias ou un mot de passe.
 */
tasks.register('signingStatus') {
    doLast {
        println hasReleaseSigning
            ? '[signature] release SIGNEE — cle de televersement fournie'
            : '[signature] release NON SIGNEE — aucune cle fournie (attendu hors depot Store)'
    }
}
