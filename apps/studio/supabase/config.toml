# Projet Supabase DÉDIÉ ELSATIA Studio (décision propriétaire « B + I1 », 2026-09-26).
# Local uniquement : `supabase start --workdir apps/studio`. Aucun projet distant n'est lié ici.
#
# Identité : Studio n'a PAS de comptes propres. Les utilisateurs Auth de ce projet sont créés par
# le pont d'identité signé (apps/studio/src/app/auth/elsatia/*) avec la clé service Studio, à partir
# d'un compte ELSATIA central. Toute inscription publique est donc fermée au niveau GoTrue.
project_id = "elsatia-studio"

[api]
enabled = true
port = 64321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 64322
shadow_port = 64320
major_version = 17

[db.migrations]
enabled = true

[db.seed]
enabled = false

[studio]
enabled = true
port = 64323

[inbucket]
enabled = true
port = 64324

[storage]
enabled = true
# Studio exige 1 Gio par fichier ; sans effet sur les autres applications (projet isolé).
file_size_limit = "1GiB"

[auth]
enabled = true
site_url = "http://127.0.0.1:3030"
additional_redirect_urls = ["http://127.0.0.1:3030/auth/elsatia/exchange"]
# Fenêtre résiduelle d'un access token après révocation (vérification sans état par PostgREST) :
# 10 min, réglable ici sans toucher Gestion Pro.
jwt_expiry = 600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
# Fermeture à la frontière Auth : seule la clé service (pont d'identité) crée des utilisateurs.
enable_signup = false
enable_anonymous_sign_ins = false
enable_manual_linking = false
minimum_password_length = 12

[auth.email]
enable_signup = false
enable_confirmations = true
double_confirm_changes = true
secure_password_change = true

[auth.sms]
enable_signup = false

[auth.mfa.totp]
enroll_enabled = false
verify_enabled = false
