name: Studio full render templates and editor qualification
on: workflow_dispatch
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r workers/studio-video/analysis/requirements.txt
      - run: echo "STUDIO_ANALYSIS_PYTHON=$(which python)" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci && npm ci --prefix apps/studio && npm ci --prefix workers/studio-video
      - run: apps/studio/node_modules/.bin/playwright install --with-deps chromium
      - run: npm run lint --prefix workers/studio-video && npm run typecheck --prefix workers/studio-video && npm test --prefix workers/studio-video
      - run: npm audit --prefix workers/studio-video --audit-level=high
      - run: node apps/studio/scripts/e2e-gate.mjs
        env:
          STUDIO_E2E_LARGE_MIB: 64
      - run: node apps/studio/scripts/e2e-gate.mjs --analysis-only
        env:
          STUDIO_E2E_LARGE_MIB: 64
          STUDIO_AI_TEST_PROVIDER_FAILURE: "1"
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: studio-render-failures
          path: apps/studio/test-results
