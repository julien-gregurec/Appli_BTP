name: Contrôles techniques

on:
  pull_request:
  push:
    branches:
      - main
      - release/commercialisation-v1
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verification:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Le secret Stripe Test vit dans cet environnement, pas au niveau du dépôt :
    # un secret de dépôt serait lisible par n'importe quel job, y compris un futur
    # job de déploiement Production. Cet environnement ne sert qu'aux contrôles.
    environment: ci-verification
    env:
      # Le prix affiché doit être le prix facturé. Sans ce drapeau, le contrôle
      # « skippe » silencieusement quand aucun accès Stripe n'est présent — c'est
      # exactement ce qui a laissé vivre la divergence TARIFS-V2. En strict, une
      # configuration Stripe absente est un ÉCHEC, pas un avertissement.
      STRIPE_PRICES_VERIFY_STRICT: "1"
      # Clé de LECTURE du compte Stripe TEST (`sk_test_…`), portée par
      # l'environnement `ci-verification` seul. Le script refuse une clé Live.
      # Les Price IDs, eux, ne sont pas des secrets : ils sont versionnés dans
      # config/stripe-prices.test.json, donc un seul secret suffit ici.
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_TEST_SECRET_KEY }}
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # Contrôle du manifeste d'environnement : AUCUNE installation ni valeur de secret requise
      # (lecture du code et des gabarits seulement). Placé AVANT `npm ci` pour échouer vite.
      # Il refuse : variable inconnue, secret sous un nom public, secret injecté par next.config,
      # variable serveur dans un composant client, gabarit incohérent (variable requise absente,
      # adresse locale en preview/production, ELSATIA_APPLICATION_ENV faux, drapeau à la mauvaise
      # valeur, secret avec une vraie valeur). Il SIGNALE (sans échouer) les DECISION_REQUIRED
      # dont les contrats Stripe incompatibles. Voir docs/runbooks/ELSATIA_ENV_MANIFEST_RUNBOOK_V1.md.
      - name: Manifeste d'environnement (code, gabarits, public/secret, DR)
        run: npm run verify:env-manifest

      - name: Tests du contrôle du manifeste (valeurs factices)
        run: npm run test:env-manifest

      - name: Tests du smoke e-mail Preview (sans réseau)
        run: npm run test:smoke-email

      - name: Tests du pack d'exécution Preview (sans réseau, sans dépendance)
        run: npm run test:preview-pack

      - name: Attendus du train (migrations, DB verify, runbooks) générés et à jour
        run: npm run verify:train-expectations

      - name: Tests du script Stripe Test ordre/rejeu (sans réseau, sk_live refusée)
        run: npm run test:stripe-ordering-script

      - name: Tests du script Stripe Test essai (sans réseau, sk_live refusée)
        run: npm run test:stripe-trial-script

      - name: Tests du script Stripe Test réabonnement (sans réseau, sk_live refusée)
        run: npm run test:stripe-resubscription-script

      # Registre des seeds (tout script de données classé, contournements déclarés, LEGACY refusés,
      # patron « document engagé → lignes » interdit), plan et script SQL du seed Preview, garde du
      # wrapper Preview. Sans base ni dépendance.
      - name: Seeds — registre, seed Preview, garde du wrapper (sans base)
        run: npm run test:seeds

      # Garde-fou de l'outillage DR V2 (Production refusée par défaut, cible distante sur
      # autorisation explicite, bases elsatia_dr_* seulement). Sans base ni dépendance ; le drill
      # lui-même (`npm run dr:verify`) exige PostgreSQL, Docker et GoTrue, il reste manuel.
      - name: DR V2 — garde-fou de cible (sans base)
        run: npm run test:dr-guard

      - name: Scan de secrets dans les fichiers suivis
        run: npm run verify:secrets

      - name: Installation verrouillée
        run: npm ci

      # `npm run typecheck` compile aussi apps/tools, qui a son propre lock.
      # Sans cette installation le typecheck echoue sur des modules absents —
      # panne preexistante a ce lot, sans rapport avec Stripe.
      - name: Installation verrouillée (apps/tools)
        run: npm ci --prefix apps/tools

      - name: Audit des vulnérabilités élevées et critiques
        run: npm run audit:security

      # Contrôle bloquant et non contournable : ce job n'est jamais facultatif,
      # et ce pas n'a ni `continue-on-error` ni `if:` d'échappement. S'il casse,
      # soit un tarif Stripe Test diverge du contrat canonique, soit le secret
      # STRIPE_TEST_SECRET_KEY n'est pas configuré. Les deux doivent bloquer.
      - name: Tarifs Stripe Test alignés sur le contrat canonique (strict)
        run: npm run verify:stripe-prices

      - name: Contrôles reproductibles
        env:
          # Le build Tools de la CI n'est pas un build publié. Sans cette déclaration, la garde
          # `apps/tools/scripts/verify-public-env.mjs` le traiterait comme un build Production —
          # c'est sa règle par défaut, celle de `getAppEnvironment()` — et exigerait les variables
          # publiques du compte et de l'abonnement, que la CI n'a pas et n'a pas à avoir.
          NEXT_PUBLIC_TOOLS_ENV: local
        run: npm run verify

  # Compatibilité RÉELLE des seeds avec le train de migrations : base PostgreSQL 16 fraîche,
  # TOUTES les migrations rejouées, puis chaque seed exécuté séparément (stderr affiché), rejoué
  # quand il se dit rejouable (même état final exigé), contrôles de clés étrangères et
  # d'invariants métier, reprise après interruption du seed Preview, cycle nettoyage/reseed du
  # pilote, reset de la démo, sauvegarde/restauration/rejeu du drill DR. Une migration qui rend un
  # seed incompatible fait échouer ce job. Voir docs/qualification/ELSATIA_SEED_COMPATIBILITY_HARDENING_V1.md.
  seeds:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: PostgreSQL 16 local (+ PL/Python et PyNaCl pour le stub pgsodium du drill DR)
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-16 postgresql-plpython3-16 python3-nacl
          sudo systemctl start postgresql
          # Mot de passe jetable, généré pour ce job : les scripts DR se connectent en TCP local.
          SEEDS_DR_PGPASSWORD="$(openssl rand -hex 24)"
          echo "::add-mask::$SEEDS_DR_PGPASSWORD"
          echo "SEEDS_DR_PGPASSWORD=$SEEDS_DR_PGPASSWORD" >> "$GITHUB_ENV"
          sudo -u postgres psql -X -q -c "alter role postgres password '$SEEDS_DR_PGPASSWORD'"

      - name: Harnais de compatibilité des seeds (base fraîche)
        run: sudo -E env "PATH=$PATH" node scripts/seeds/verify-seeds.mjs --report=seeds-report.json

      - name: Rapport du harnais
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seeds-report
          path: seeds-report.json
          if-no-files-found: ignore
