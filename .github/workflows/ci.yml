name: Contrôles techniques

on:
  pull_request:
  push:
    branches:
      - main
      - release/commercialisation-v1
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verification:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Le secret Stripe Test vit dans cet environnement, pas au niveau du dépôt :
    # un secret de dépôt serait lisible par n'importe quel job, y compris un futur
    # job de déploiement Production. Cet environnement ne sert qu'aux contrôles.
    environment: ci-verification
    env:
      # Le prix affiché doit être le prix facturé. Sans ce drapeau, le contrôle
      # « skippe » silencieusement quand aucun accès Stripe n'est présent — c'est
      # exactement ce qui a laissé vivre la divergence TARIFS-V2. En strict, une
      # configuration Stripe absente est un ÉCHEC, pas un avertissement.
      STRIPE_PRICES_VERIFY_STRICT: "1"
      # Clé de LECTURE du compte Stripe TEST (`sk_test_…`), portée par
      # l'environnement `ci-verification` seul. Le script refuse une clé Live.
      # Les Price IDs, eux, ne sont pas des secrets : ils sont versionnés dans
      # config/stripe-prices.test.json, donc un seul secret suffit ici.
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_TEST_SECRET_KEY }}
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Installation verrouillée
        run: npm ci

      # `npm run typecheck` compile aussi apps/tools, qui a son propre lock.
      # Sans cette installation le typecheck echoue sur des modules absents —
      # panne preexistante a ce lot, sans rapport avec Stripe.
      - name: Installation verrouillée (apps/tools)
        run: npm ci --prefix apps/tools

      - name: Audit des vulnérabilités élevées et critiques
        run: npm run audit:security

      # Contrôle bloquant et non contournable : ce job n'est jamais facultatif,
      # et ce pas n'a ni `continue-on-error` ni `if:` d'échappement. S'il casse,
      # soit un tarif Stripe Test diverge du contrat canonique, soit le secret
      # STRIPE_TEST_SECRET_KEY n'est pas configuré. Les deux doivent bloquer.
      - name: Tarifs Stripe Test alignés sur le contrat canonique (strict)
        run: npm run verify:stripe-prices

      - name: Contrôles reproductibles
        run: npm run verify
