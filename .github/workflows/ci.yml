name: Contrôles techniques

on:
  pull_request:
  push:
    branches:
      - main
      - release/commercialisation-v1
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verification:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Installation verrouillée
        run: npm ci

      - name: Audit des vulnérabilités élevées et critiques
        run: npm run audit:security

      - name: Contrôles reproductibles
        run: npm run verify
